<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Streamflix — We'll Be Back Soon</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #141414; 
            --bg-card: #181818; 
            --red: #E50914; 
            --red-dark: #B20710; 
            --red-glow: rgba(229,9,20,0.4);
            --text: #ffffff; 
            --text-muted: #b3b3b3; 
            --text-dim: #808080;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100%; 
            width: 100%; 
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', system-ui, sans-serif; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 20px;
            position: relative;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 20%, rgba(229,9,20,0.15), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .maintenance-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--red);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 25px var(--red-glow);
            margin-bottom: 40px;
            user-select: none;
        }

        .icon-wrapper {
            font-size: 4.5rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            position: relative;
        }

        .icon-wrapper i {
            animation: pulseIcon 3s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }

        .loading-bar-container {
            width: 250px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .loading-bar-fill {
            width: 40%;
            height: 100%;
            background: var(--red);
            border-radius: 2px;
            box-shadow: 0 0 15px var(--red-glow);
            animation: loadAnim 2s ease-in-out infinite;
        }

        @keyframes loadAnim {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #46d369;
            border-radius: 50%;
            box-shadow: 0 0 10px #46d369;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--red);
        }

        @media (max-width: 600px) {
            .logo { font-size: 2.8rem; margin-bottom: 30px; }
            .icon-wrapper { font-size: 3.5rem; margin-bottom: 20px; }
            p { font-size: 1rem; margin-bottom: 30px; }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <div class="logo">Streamflix</div>
        
        <div class="icon-wrapper">
            <i class="fas fa-screwdriver-wrench"></i>
        </div>
        
        <h1>We'll Be Back Soon</h1>
        <p>We're currently performing some necessary maintenance and upgrades to bring you a better streaming experience. Grab some popcorn and check back shortly!</p>
        
        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
        
        <div class="status-badge">
            <div class="status-dot"></div>
            Systems Upgrading
        </div>
    </div>

  
</body>
</html>
