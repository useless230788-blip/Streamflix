name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp *.html www/
          cp streamflix-icon.png www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Set app icon
        run: |
          if [ -f streamflix-icon.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in android/app/src/main/res/mipmap-*; do
              cp streamflix-icon.png "$d/ic_launcher.png"
              cp streamflix-icon.png "$d/ic_launcher_round.png"
              cp streamflix-icon.png "$d/ic_launcher_foreground.png"
            done
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: streamflix-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
